*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{margin:0;min-height:100dvh;overflow-x:hidden;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

.bg{position:fixed;inset:-25%;z-index:-3;pointer-events:none;
  background:var(--cover) center 30%/cover no-repeat,#04121e;
  filter:blur(60px) saturate(1.5) brightness(.85);opacity:var(--bgo);
  animation:drift 30s ease-in-out infinite alternate}
.veil{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,11,20,.25) 0,rgba(5,11,20,.75) 40%,var(--bg) 92%)}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
@keyframes drift{to{transform:scale(1.18) rotate(6deg) translate3d(4%,3%,0)}}

.page{width:100%;max-width:460px;margin:0 auto;padding:26px 18px 44px}

.head{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.cover{position:relative;flex:none;width:84px;height:84px;border-radius:16px;overflow:hidden;
  background:var(--cover) center/cover no-repeat;border:1px solid var(--line);box-shadow:var(--shadow)}
.cover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
h1{margin:0;font-size:clamp(24px,7vw,32px);line-height:1.04;font-weight:900;letter-spacing:-.03em;
  text-wrap:balance;overflow-wrap:anywhere}
.artist{margin:5px 0 0;font-size:15px;font-weight:500;color:var(--muted)}

.marq{overflow:hidden;margin:0 -18px 22px;padding:10px 0;border-block:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.marq-track{display:flex;width:max-content;animation:marq 22s linear infinite}
.marq-track span{display:flex;align-items:center;gap:16px;padding-right:16px;white-space:nowrap;
  font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--beam)}
.marq-track i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.6}
@keyframes marq{to{transform:translateX(-50%)}}

.video{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;display:block;cursor:pointer;
  border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:26px;
  background:var(--cover) center 30%/cover no-repeat,#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;z-index:3}
.video::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,10,18,.15),rgba(4,10,18,.65))}
.video .play{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  gap:10px;color:#fff;font-size:14px;font-weight:700;letter-spacing:.02em}
.video .ring{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;backdrop-filter:blur(4px);
  transition:transform .15s ease}
.video:active .ring{transform:scale(.92)}
.video .ring svg{width:22px;height:22px;fill:#fff;margin-left:3px}
.video .label{position:absolute;left:16px;bottom:14px;z-index:2;font-size:13px;font-weight:700;color:#fff;
  display:flex;align-items:center;gap:8px}
.video .label svg{width:16px;height:16px;fill:#fff;opacity:.9}

h2{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

.links{display:grid;gap:10px}
.btn{--c:#bfe9ff;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;
  min-height:70px;padding:10px 16px 10px 10px;border-radius:20px;color:var(--text);text-decoration:none;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  -webkit-tap-highlight-color:transparent;transition:transform .14s ease,border-color .2s}
.btn::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;transition:opacity .2s;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 25%,transparent),transparent 60%)}
.btn:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.btn:hover::before,.btn:active::before{opacity:1}
.btn:active{transform:scale(.975)}
.btn:focus-visible{outline:3px solid var(--beam);outline-offset:3px}
.chip{position:relative;flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center}
.chip svg{width:27px;height:27px;fill:currentColor;display:block}
.txt{position:relative;display:grid;gap:1px;min-width:0}
.txt b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.txt span{font-size:13px;color:var(--muted)}

.btn.primary{--c:#fff;min-height:82px;border:0;color:#fff;
  background:linear-gradient(120deg,#0e6fa8,#083b5c);box-shadow:0 14px 34px rgba(14,111,168,.5)}
.btn.primary::before{display:none}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:38%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-20deg);animation:shine 4.6s ease-in-out 2.6s infinite}
.btn.primary .txt b{font-size:19px}
.btn.primary .txt span{color:rgba(255,255,255,.9)}
.btn.primary .chip{background:#fff;color:#0e6fa8}
.btn.primary .chip .tri{fill:#fff}
@keyframes shine{0%{left:-60%}38%,100%{left:135%}}

.sp{--c:#1db954}.sp .chip{background:#1db954;color:#07130b}
.am{--c:#fa243c}.am .chip{background:#fa243c;color:#fff}
.ym{--c:#ff2a2a}.ym .chip{background:#212121;color:#ff2a2a}
.dz{--c:#a238ff}.dz .chip{background:#a238ff;color:#fff}
.az{--c:#25d1da}.az .chip{background:#25d1da;color:#062b2e}
.tt{--c:#25f4ee}.tt .chip{background:#000;color:#fff;border:1px solid rgba(255,255,255,.18)}

footer{margin-top:30px;text-align:center;font-size:12px;color:var(--muted)}

.reveal{animation:rise .8s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(var(--d,0)*90ms + 250ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  function playInline(){
    var id=box.getAttribute('data-id');
    var f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0';
    f.title='Video de Tan Real';
    f.allow='autoplay; accelerometer; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen=true;
    box.innerHTML='';
    box.appendChild(f);
    box.removeAttribute('role'); box.removeAttribute('tabindex');
  }
  box.addEventListener('click',playInline);
  box.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();playInline();}});
})();
